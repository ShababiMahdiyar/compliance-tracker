<div class="heatmap">
  <div class="heatmap__chart-wrap">
    <svg #chart preserveAspectRatio="xMidYMid meet"></svg>
    <div #tooltip class="heatmap__tooltip"></div>
  </div>

  <!-- Legend -->
  <div class="heatmap__legend">
    <span class="heatmap__legend-label">0%</span>
    <div class="heatmap__legend-bar"></div>
    <span class="heatmap__legend-label">100%</span>
  </div>
</div>
