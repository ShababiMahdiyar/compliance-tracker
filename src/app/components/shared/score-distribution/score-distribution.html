<div class="score-dist">
  <div class="score-dist__chart-wrap">
    <svg #chart preserveAspectRatio="xMidYMid meet"></svg>
    <div #tooltip class="score-dist__tooltip"></div>
  </div>

  <!-- Legend -->
  <div class="score-dist__legend">
    <div class="score-dist__legend-item">
      <span class="score-dist__legend-dot" style="background: #10b981"></span>
      <span class="score-dist__legend-label">Excellent (85+)</span>
    </div>
    <div class="score-dist__legend-item">
      <span class="score-dist__legend-dot" style="background: #f59e0b"></span>
      <span class="score-dist__legend-label">Good (70–84)</span>
    </div>
    <div class="score-dist__legend-item">
      <span class="score-dist__legend-dot" style="background: #ef4444"></span>
      <span class="score-dist__legend-label">Below (< 70)</span>
    </div>
  </div>
</div>
