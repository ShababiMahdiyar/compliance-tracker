<div class="timeline">
  <div class="timeline__chart-wrap">
    <svg #chart preserveAspectRatio="xMidYMid meet"></svg>
    <div #tooltip class="timeline__tooltip"></div>
  </div>

  <!-- Status Legend -->
  <div class="timeline__legend">
    <div class="timeline__legend-item">
      <span class="timeline__legend-dot" style="background: #10b981"></span>
      <span class="timeline__legend-label">Completed</span>
    </div>
    <div class="timeline__legend-item">
      <span class="timeline__legend-dot" style="background: #f59e0b"></span>
      <span class="timeline__legend-label">In Progress</span>
    </div>
    <div class="timeline__legend-item">
      <span class="timeline__legend-dot" style="background: #64748b"></span>
      <span class="timeline__legend-label">Not Started</span>
    </div>
    <div class="timeline__legend-item">
      <span class="timeline__legend-dot" style="background: #ef4444"></span>
      <span class="timeline__legend-label">Overdue</span>
    </div>
    <div class="timeline__legend-item">
      <span class="timeline__legend-dot" style="background: #7c3aed"></span>
      <span class="timeline__legend-label">Expired</span>
    </div>
  </div>
</div>
