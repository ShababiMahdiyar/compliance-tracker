name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npx ng test --no-watch --no-progress --browsers=ChromeHeadless

      - name: Build
        run: npx ng build --configuration=production

      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/compliance-tracker/browser/
          retention-days: 7

      # - name: Lint
      #   run: npx ng lint
